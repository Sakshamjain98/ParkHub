name: CI Build & Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v4
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/api:latest

      - name: Build & push web image
        uses: docker/build-push-action@v4
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/web:latest

      - name: Build & push web-admin image
        uses: docker/build-push-action@v4
        with:
          context: ./apps/web-admin
          file: ./apps/web-admin/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/web-admin:latest

      - name: Build & push web-manager image
        uses: docker/build-push-action@v4
        with:
          context: ./apps/web-manager
          file: ./apps/web-manager/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/web-manager:latest

      - name: Build & push web-valet image
        uses: docker/build-push-action@v4
        with:
          context: ./apps/web-valet
          file: ./apps/web-valet/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/web-valet:latest

  deploy-backend:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Trigger Render deploy for API
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_SERVICE_ID: ${{ secrets.RENDER_API_SERVICE_ID }}
        run: |
          curl -X POST "https://api.render.com/v1/services/${RENDER_API_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":false}'

  deploy-vercel:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm i -g vercel

      - name: Deploy apps to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel --prod --confirm --token=$VERCEL_TOKEN --cwd=apps/web
          vercel --prod --confirm --token=$VERCEL_TOKEN --cwd=apps/web-admin
          vercel --prod --confirm --token=$VERCEL_TOKEN --cwd=apps/web-manager
          vercel --prod --confirm --token=$VERCEL_TOKEN --cwd=apps/web-valet

  one-shot-prisma-seed:
    name: One-shot Prisma seed on Render
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Create RUN_PRISMA_SETUP env var on Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_SERVICE_ID: ${{ secrets.RENDER_API_SERVICE_ID }}
        id: create_env
        run: |
          set -e
          echo "Creating RUN_PRISMA_SETUP=true as an env var on Render service ${RENDER_API_SERVICE_ID}"
          resp=$(curl -s -X POST "https://api.render.com/v1/services/${RENDER_API_SERVICE_ID}/env-vars" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"key":"RUN_PRISMA_SETUP","value":"true","isSecret":false}')
          echo "$resp"
          env_id=$(echo "$resp" | jq -r '.id')
          if [ "$env_id" = "null" ] || [ -z "$env_id" ]; then
            echo "Failed to create env var: $resp"
            exit 1
          fi
          echo "env_id=$env_id" >> $GITHUB_OUTPUT

      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_SERVICE_ID: ${{ secrets.RENDER_API_SERVICE_ID }}
        id: trigger_deploy
        run: |
          set -e
          echo "Triggering deploy for Render service ${RENDER_API_SERVICE_ID}"
          resp=$(curl -s -X POST "https://api.render.com/v1/services/${RENDER_API_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":false}')
          echo "$resp"
          deploy_id=$(echo "$resp" | jq -r '.id')
          if [ "$deploy_id" = "null" ] || [ -z "$deploy_id" ]; then
            echo "Failed to create deploy: $resp"
            exit 1
          fi
          echo "deploy_id=$deploy_id" >> $GITHUB_OUTPUT

      - name: Wait for deploy to complete
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_SERVICE_ID: ${{ secrets.RENDER_API_SERVICE_ID }}
        run: |
          set -e
          deploy_id=${{ steps.trigger_deploy.outputs.deploy_id }}
          echo "Waiting for deploy $deploy_id to finish..."
          for i in $(seq 1 60); do
            status=$(curl -s -H "Authorization: Bearer ${RENDER_API_KEY}" "https://api.render.com/v1/deploys/$deploy_id" | jq -r '.state')
            echo "Deploy status: $status"
            if [ "$status" = "active" ]; then
              echo "Deploy succeeded"
              exit 0
            fi
            if [ "$status" = "failed" ]; then
              echo "Deploy failed"
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for deploy"
          exit 1

      - name: Delete RUN_PRISMA_SETUP env var from Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_SERVICE_ID: ${{ secrets.RENDER_API_SERVICE_ID }}
        run: |
          set -e
          env_id=${{ steps.create_env.outputs.env_id }}
          echo "Deleting env var id $env_id"
          resp=$(curl -s -X DELETE "https://api.render.com/v1/services/${RENDER_API_SERVICE_ID}/env-vars/$env_id" \
            -H "Authorization: Bearer ${RENDER_API_KEY}")
          echo "$resp"
