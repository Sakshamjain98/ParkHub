services:
  # Database is hosted externally on Render — remove local Postgres service.
  # If you still want a local DB for development, re-add a postgres service here.

  # Redis is hosted on Upstash (external). The app will connect using
  # REDIS_URL from the environment, so no local redis container is started.
  edge-proxy:
    container_name: ParkHub_edge_proxy
    image: nginx:1.27-alpine
    restart: always
    ports:
      - 8080:8080
    volumes:
      - ./nginx/default.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - host.docker.internal:host-gateway
volumes:
  # No local volumes required when using external services
  db_data_ParkHub:
  redis_data_ParkHub:
