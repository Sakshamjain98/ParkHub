# Render service template — fill in your repo and names before applying
services:
  - type: web
    name: parkhub-api
    env: docker
    # Dockerfile path must be relative to the `rootDirectory` below.
    # Because `rootDirectory: ./apps/api` is set, use the Dockerfile name only.
    dockerfilePath: Dockerfile
    repo: https://github.com/Sakshamjain98/ParkHub.git
    branch: master
    # If your Render service Root Directory is set to ./apps/api (monorepo),
    # keep the build/start commands relative to that directory.
    rootDirectory: ./apps/api
    buildCommand: "yarn install --frozen-lockfile && yarn build"
    startCommand: "yarn start:prod"
    envVars:
      - key: DATABASE_URL
        value: "postgresql://my_db_l5px_user:suXEZ3YLX3Tl21vzeK18iTryiKNRFZ0s@dpg-d70i5iqa214c73eaj640-a.oregon-postgres.render.com/my_db_l5px"
      - key: REDIS_URL
        value: "redis://default:AZVrAAIncDFlOTZiMzU5OTAwZDM0MTQ5Yjc0MGYwYTI4ZTNlMTIzYXAxMzgyNTE@exotic-muskox-38251.upstash.io:6379"

databases:
  - type: postgres
    name: parkhub-db
    plan: starter
    region: oregon

